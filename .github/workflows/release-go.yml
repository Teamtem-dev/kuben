name: Release (Go)

# Push a tag `v2.X.Y` or `v2.X.Y-{alpha,beta,rc}.N` (plan §14, release train).
# goreleaser builds the Go hub for 5 targets and the agent for Linux with the
# names, checksums and signatures of the Rust releases (install.sh relies on
# them); this workflow adds build provenance, the multi-arch image on GHCR,
# the Helm chart and the install check. 1.x tags stay with release.yml.

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v2.0.0-alpha.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/teamtem-dev/kuben

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        name: Validate the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Only the train's shapes: 2.0.0-alpha.N → beta.N → rc.N → 2.0.0.
          if [[ ! "$TAG" =~ ^v2\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is not v2.MINOR.PATCH[-(alpha|beta|rc).N]"; exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          { echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; } >>"$GITHUB_OUTPUT"

  # Every test of the Go modules against PostgreSQL and envtest, on the
  # tagged commit: nothing is published from a commit whose tests fail.
  test:
    name: Go tests
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBEN_TEST_PG_URL: postgres://postgres:kuben@localhost:5432/postgres
      KUBEN_REQUIRE_PG: "1"
      KUBEN_REQUIRE_K8S: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/hub/go.mod
          cache: false
      - run: for m in go/*/; do (cd "$m" && go mod verify); done
      - name: Kubernetes API server binaries (envtest)
        run: |
          assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1 use 1.37.x -p path --bin-dir "$RUNNER_TEMP/envtest")
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: for m in go/hub go/agent go/kubenapi; do (cd "$m" && go test -race ./...); done
      - run: cd go/hub && go tool govulncheck ./...

  web:
    name: Web UI
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Build and check the size budget
        working-directory: apps/console
        run: bun run build && bun run size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-dist
          path: apps/console/dist
          if-no-files-found: error

  publish:
    name: Build and publish (goreleaser)
    needs: [plan, test, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
          # goreleaser reads the previous tag for the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/hub/go.mod
          # No build cache in release jobs: a poisoned cache can never reach
          # a published artifact.
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: console-dist
          path: apps/console/dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Budgets and a smoke run of the Linux binary
        run: |
          bin=$(find dist -path '*kuben_linux_amd64*' -name kuben -type f | head -n1)
          scripts/check-budgets.sh binary "$bin"
          "$bin" --version | tee /dev/stderr | grep -F "${{ needs.plan.outputs.version }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-archives
          path: dist/kuben-*-unknown-linux-musl.tar.gz
          if-no-files-found: error

  image:
    name: Container image (linux/amd64, linux/arm64)
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-archives
          path: dist
      - name: Stage binaries per platform
        run: |
          mkdir -p image/linux-amd64 image/linux-arm64
          tar -xzf dist/kuben-x86_64-unknown-linux-musl.tar.gz -C image/linux-amd64 kuben kuben-agent
          tar -xzf dist/kuben-aarch64-unknown-linux-musl.tar.gz -C image/linux-arm64 kuben kuben-agent
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` and `X.Y` only for stable releases; pre-releases get their exact tag.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }}
          flavor: latest=auto
      - name: Image size budget (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/release.Dockerfile
          platforms: linux/amd64
          load: true
          tags: kuben:budget
      - run: scripts/check-budgets.sh image kuben:budget
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: trivy@0.74.0
      - name: Vulnerability scan (Trivy)
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 kuben:budget
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    name: Helm chart (OCI)
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package and push to oci://ghcr.io/teamtem-dev/charts
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint --strict charts/kuben
          helm package charts/kuben --version "$VERSION" --app-version "$VERSION" --destination dist
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/kuben-${VERSION}.tgz" oci://ghcr.io/teamtem-dev/charts 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          [[ $digest == sha256:* ]] || { echo "no digest in the helm push output" >&2; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$REGISTRY_USER" --password-stdin
          cosign sign --yes "ghcr.io/teamtem-dev/charts/kuben@${digest}"

  verify-install:
    name: install.sh on ${{ matrix.os }}
    needs: [plan, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install the published release and run it
        env:
          KUBEN_VERSION: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash install.sh --dir "$RUNNER_TEMP/bin" --no-sudo
          "$RUNNER_TEMP/bin/kuben" --version | tee /dev/stderr | grep -F "$VERSION"

  smoke:
    name: Smoke test
    needs: [plan, publish, chart]
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/smoke.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      upgrade_from: previous
