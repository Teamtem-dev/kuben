name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci
  TURBO_TELEMETRY_DISABLED: "1"
  # Turborepo remote cache, opt-in (repository variable TURBO_TEAM, secret
  # TURBO_TOKEN). Like the Rust cache, pull requests read it but never write it.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_CACHE: ${{ github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}

defaults:
  run:
    shell: bash

# Every job runs the turbo task a developer runs locally (turbo.json, ADR-024);
# .github/actions/setup installs Bun, the JS dependencies and, when asked, Rust.
jobs:
  # Pull requests run only the job groups their files touch
  # (scripts/ci-changes.sh). Pushes to main, the merge queue and manual runs
  # always run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      deps: ${{ steps.detect.outputs.deps }}
      web: ${{ steps.detect.outputs.web }}
      codegen: ${{ steps.detect.outputs.codegen }}
      scripts: ${{ steps.detect.outputs.scripts }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base branch).
          fetch-depth: 2
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == pull_request ]] && git rev-parse -q --verify HEAD^1 >/dev/null; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          else
            : > "$RUNNER_TEMP/changed.txt"
            bash scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi
          {
            echo "### Selected job groups"
            echo '```'
            grep -E '^(rust|deps|web|codegen|scripts|go)=' "$GITHUB_OUTPUT"
            echo '```'
            echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed file(s)"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-components: rustfmt
          rust-cache-key: fmt
      - run: bun turbo run format --filter=kuben-cargo -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-components: clippy
      # The whole workspace, then the activator placeholder that default
      # builds leave out.
      - run: bun turbo run kuben-cargo#lint kuben#lint:activator

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: ${{ matrix.name }}
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest
      - run: bun turbo run kuben-cargo#test
      # nextest does not run doctests; they are platform-independent.
      - name: Doctests
        if: matrix.name == 'linux-x64'
        run: bun turbo run kuben-cargo#test:doc

  go:
    name: Go (lint, race tests, vulnerabilities)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBEN_TEST_PG_URL: postgres://postgres:kuben@localhost:5432/postgres
      # A database test that skips here fails instead (go/CONVENTIONS.md).
      KUBEN_REQUIRE_PG: "1"
      # Likewise for the tests against a Kubernetes API server (envtest).
      KUBEN_REQUIRE_K8S: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/hub/go.mod
          cache-dependency-path: "go/*/go.sum"
      - uses: $/.github/actions/setup
      # Checksums against sum.golang.org (the sandbox mirror cannot check them).
      - run: for m in go/*/; do (cd "$m" && go mod verify); done
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go/hub
          args: --config ../../.golangci.yml
      # kube-apiserver and etcd for internal/platform/kubetest, pinned with
      # controller-runtime's release.
      - name: Kubernetes API server binaries (envtest)
        run: |
          assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1 use 1.37.x -p path --bin-dir "$RUNNER_TEMP/envtest")
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: bun turbo run lint test --filter=hub --filter=agent --filter=kubenapi --filter=tools
      - run: cd go/hub && go tool govulncheck ./...
      - run: scripts/rust-drift.sh

  oracle:
    name: Go matches Rust (oracle)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgres://postgres:kuben@localhost:5432
      REFEREE: v1.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/hub/go.mod
          cache-dependency-path: "go/*/go.sum"
      - uses: $/.github/actions/setup
      # The released Rust binary is the referee (plan §3, principle 4).
      - name: Fetch the Rust referee
        run: |
          asset=kuben-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/Teamtem-dev/kuben/releases/download/$REFEREE
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$asset" && curl -fsSLO "$base/$asset.sha256"
          echo "$(cut -d' ' -f1 "$asset.sha256")  $asset" | sha256sum -c -
          mkdir rust && tar -xzf "$asset" -C rust && find rust -name kuben -type f -exec mv {} kuben-rust \;
      - run: bun turbo run hub#build
      - name: Start both servers on empty databases
        run: |
          psql "$PG/postgres" -c 'CREATE DATABASE rust' -c 'CREATE DATABASE go'
          start() { # <binary> <db> <port>
            KUBEN_DATABASE__URL="$PG/$2" KUBEN_SERVER__BIND="127.0.0.1:$3" KUBEN_SERVER__STATE_DIR="$RUNNER_TEMP/state-$2" \
              "$1" serve >"$RUNNER_TEMP/$2.log" 2>&1 &
          }
          start "$RUNNER_TEMP/kuben-rust" rust 3001
          start "$PWD/go/hub/bin/kuben" go 3002
          for port in 3001 3002; do
            for _ in $(seq 60); do curl -fs "http://127.0.0.1:$port/readyz" && break; sleep 1; done
          done
      - run: go test -run TestSkeletonMatchesRust -v ./test/oracle/
        working-directory: go/hub
        env:
          KUBEN_ORACLE_RUST: http://127.0.0.1:3001
          KUBEN_ORACLE_GO: http://127.0.0.1:3002
      - if: failure()
        run: tail -n 100 "$RUNNER_TEMP/rust.log" "$RUNNER_TEMP/go.log"

  postgres:
    name: Store matrix (PostgreSQL 17)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBEN_TEST_PG_URL: postgres://postgres:kuben@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest
      - run: bun turbo run kuben-store#test:postgres

  msrv:
    name: MSRV (1.94)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: "1.94"
      # RUSTUP_TOOLCHAIN beats rust-toolchain.toml (which tracks stable) and is
      # part of the task hash.
      - run: bun turbo run kuben-cargo#check -- --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.94"

  deny:
    name: Supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  web:
    name: Web (Biome, typecheck, test, build, size)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # turbo reads the Cargo workspace on every run, so even web-only jobs need Rust.
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: web
      - run: bun turbo run biome:check check test build size --filter=// --filter='@kuben/*'
      # M2.16: the built console in a browser, English and Persian (LTR and
      # RTL), dark and light: axe (WCAG 2.1 AA) and Kuben's CSP, API mocked.
      - name: Console in a browser (Playwright, axe)
        working-directory: apps/console/e2e
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium-headless-shell
          npx playwright test

  drift:
    name: Generated files up to date
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-save: "false"
      - run: bun run drift

  # Pull requests may add to the API, never break it, unless labelled
  # `breaking` (re-run the job after labelling). The base is the merge
  # commit's first parent.
  api-compat:
    name: API compatibility (oasdiff)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: 1.32.1
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install oasdiff (pinned, checksummed)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tgz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oasdiff.tgz" -C "$RUNNER_TEMP" oasdiff
      - name: Compare the spec with the base branch
        env:
          OASDIFF: ${{ runner.temp }}/oasdiff
          KUBEN_ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
        run: |
          git show HEAD^1:packages/api-client/openapi.json > "$RUNNER_TEMP/base.json" 2>/dev/null \
            || : > "$RUNNER_TEMP/base.json"
          scripts/check-api-compat.sh "$RUNNER_TEMP/base.json"

  scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Git keeps the execute bit per file; a script committed as 100644
      # fails in CI with exit code 126 ("Permission denied").
      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s -- 'scripts/*.sh' install.sh | awk '$1 != "100755" { print $4 }')
          if [[ -n $bad ]]; then
            echo "::error::not executable in git (fix: git update-index --chmod=+x <file>): $bad"
            exit 1
          fi
      - run: shellcheck install.sh scripts/*.sh scripts/spikes/*.sh
      - name: install.sh parses under sh, dash and bash
        run: |
          sudo apt-get install -y --no-install-recommends dash >/dev/null
          for shell in sh dash bash; do "$shell" -n install.sh; done
          sh install.sh --help >/dev/null
      - name: Change detection selects the right jobs
        run: scripts/ci-changes.test.sh
      - name: Helm chart
        run: |
          helm lint --strict charts/kuben
          helm template kuben charts/kuben --kube-version 1.32.0 \
            --set route.enabled=true --set route.hostname=kuben.example.com \
            --set route.gateway.name=gw --set platform.gateway=infra/gw >/dev/null
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: trivy@0.74.0
      # RBAC and pod security of what users install; exceptions are justified
      # in .trivyignore.yaml.
      - name: Helm chart misconfigurations (Trivy)
        run: scripts/scan-chart.sh

  e2e:
    name: End-to-end (kind)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Kuben keeps its data in PostgreSQL (ADR-025); the server under test
    # runs on the runner and reaches the service on localhost.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBEN_E2E_DATABASE_URL: postgres://postgres:kuben@localhost:5432/postgres
      # M2.5: the e2e run stops this container to show apps serve without it.
      KUBEN_E2E_PG_IMAGE: postgres:17-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: e2e
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kuben-e2e
          wait: 120s
      # M2.4, ADR-031's release gate: Gateway API, Traefik and cert-manager, so
      # the e2e run checks HTTPS from the runner, never through a port-forward.
      - name: Public path (Gateway API, Traefik, cert-manager)
        run: scripts/e2e-gateway.sh
      # M2.8: the agent runs as a pod in the e2e run, from an image of the
      # debug build; pods reach the hub on the runner through the kind
      # network's gateway.
      - name: Agent image for the cluster
        run: |
          cargo build --package kuben-agent --locked
          context="$RUNNER_TEMP/agent-image"
          mkdir -p "$context"
          cp target/debug/kuben-agent "$context/"
          docker build -q -f deploy/e2e-agent.Dockerfile -t kuben-agent:e2e "$context"
          kind load docker-image kuben-agent:e2e --name kuben-e2e
          gateway=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -m1 -E '^[0-9]+\.')
          {
            echo "KUBEN_E2E_AGENT_IMAGE=kuben-agent:e2e"
            echo "KUBEN_E2E_HUB=${gateway}:18082"
          } >>"$GITHUB_ENV"
      # ADR-032 option A: tags resolve to digests at their registry. First, so
      # a registry problem shows here and not as an e2e failure.
      - name: Registry resolution (network)
        run: bun turbo run kuben-api#test:network
      # Builds the debug binary first (kuben#e2e depends on kuben#build).
      - run: bun turbo run kuben#e2e
      # ADR-027 spike: stale resourceVersion writes, server-side apply with a
      # stale precondition, and racing writers against the real API server.
      # ADR-032: the materializer writes, fences and verifies runs from SQL.
      # The tests are #[ignore]d everywhere else; this step runs them with
      # --ignored, so an unreachable cluster fails instead of skipping.
      - name: Cluster tests (two writers, materializer, execution CRDs)
        run: bun turbo run kuben-platform#test:cluster
        env:
          KUBEN_TEST_PG_URL: postgres://postgres:kuben@localhost:5432/postgres
      - name: Agent executor against the cluster
        run: bun turbo run kuben-agent#test:cluster
      # The chart against the real API server, whose CRDs the e2e run applied:
      # server-side validation catches what `helm template` cannot, like a
      # custom resource that does not match its schema (v1.0.3 shipped
      # `KubenConfig.spec: null`). A dry run creates no namespace, hence default.
      - name: Helm chart validates against the cluster
        run: helm install kuben charts/kuben --namespace default --dry-run=server >/dev/null
      # M1.10: the chart's own PostgreSQL comes up, Kuben's role is not a
      # superuser, and uninstall keeps the volume and password for a re-install.
      - name: Helm chart's PostgreSQL on the cluster
        run: scripts/chart-postgres-test.sh

  # M3: isolated builds, 5 sample repos, duplicate/out-of-order push, failure
  # injection (OOM, cancellation) and control plane resiliency (§18.1).
  e2e-build:
    name: End-to-end builds (kind)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kuben
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBEN_E2E_DATABASE_URL: postgres://postgres:kuben@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: e2e-build
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kuben-e2e-build
          wait: 120s
      - run: bun turbo run kuben#build
      - name: Build engine e2e test suite
        run: scripts/e2e-build.sh

  # M1.10: `kuben setup` on a fresh runner installs or starts PostgreSQL, makes
  # the role and database kuben (peer auth, not a superuser) and runs Kuben on
  # a kind cluster; `kuben uninstall --purge` drops the database again.
  host-install:
    name: Host install (kuben setup)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: host-install
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kuben-host
          wait: 120s
      - run: bun turbo run kuben#build
      - name: kuben setup provisions PostgreSQL and runs Kuben
        run: scripts/host-install-test.sh

  # M2.10: `kuben setup` on a runner with nothing installed: a pinned k3s,
  # the platform (Traefik Gateway, Gateway API, cert-manager), the cluster
  # agent, an app over HTTPS through Kuben's Gateway, a repeat run that
  # changes nothing, and `kuben uninstall --purge` removing k3s.
  k3s-install:
    name: Host install on k3s (kuben setup)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-cache-key: k3s-install
      - run: bun turbo run kuben#build
      # k3s imports the images in its airgap directory when it starts, so the
      # agent's pod finds this build's image without a registry.
      - name: Agent image for k3s
        run: |
          cargo build --package kuben-agent --locked
          context="$RUNNER_TEMP/agent-image"
          mkdir -p "$context"
          cp target/debug/kuben-agent "$context/"
          docker build -q -f deploy/e2e-agent.Dockerfile -t kuben-agent:e2e "$context"
          sudo mkdir -p /var/lib/rancher/k3s/agent/images
          docker save kuben-agent:e2e | sudo tee /var/lib/rancher/k3s/agent/images/kuben-agent.tar >/dev/null
      - name: kuben setup installs k3s and serves an app over HTTPS
        run: scripts/k3s-install-test.sh
        env:
          KUBEN_AGENT_IMAGE: docker.io/library/kuben-agent:e2e

  budgets:
    name: Binary size budget (static musl)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust-toolchain: stable
          rust-targets: x86_64-unknown-linux-musl
          rust-cache-key: musl-release
      # The budget is measured on the shipped binary, UI included. The SPA is
      # built here (seconds) so this job never waits for the web job.
      - run: bun turbo run @kuben/console#build
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-zigbuild,cargo-auditable@0.7.5,trivy@0.74.0
      # Exactly like the release: static musl, UI and dependency list embedded.
      - run: cargo auditable zigbuild -p kuben --release --locked --features embed-ui --target "$TARGET"
      - run: scripts/check-budgets.sh binary "target/$TARGET/release/kuben"
      - name: Smoke test
        run: target/$TARGET/release/kuben --version
      # The dependency list must be present and free of fixed HIGH/CRITICAL issues.
      - name: Scan the shipped binary (Trivy)
        run: scripts/scan-binary.sh "target/$TARGET/release/kuben"

  # Static analysis of the workflows and the setup action: template injection,
  # excessive permissions, cache poisoning, impostor or unpinned actions. It
  # takes seconds, so it runs on every change instead of joining a group.
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: zizmor@1.30.1
      # The token enables the online audits (impostor commits, known-vulnerable
      # actions, ref confusion). Findings become annotations and fail the job.
      - run: zizmor --format=github --no-progress .
        env:
          GH_TOKEN: ${{ github.token }}

  # Single required check for branch protection. Jobs skipped by change
  # detection count as passed; everything else must succeed.
  ci-success:
    name: CI success
    if: always()
    needs: [changes, fmt, clippy, test, go, oracle, postgres, msrv, deny, web, drift, api-compat, scripts, budgets, e2e, e2e-build, host-install, k3s-install, zizmor]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All selected jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success"
                 and ([.[].result] | all(. == "success" or . == "skipped"))' <<<"$NEEDS" >/dev/null
