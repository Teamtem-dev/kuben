name: Security

# Advisories are published after code is merged: a go.sum that passed CI
# yesterday can be vulnerable today. This re-checks main and the published
# image every day, independent of any change.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  advisories:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # A scheduled check reads the module proxy fresh; no cache to trust.
          cache: false
      # govulncheck is pinned in tools/go.mod; it reports only
      # vulnerabilities in code the binaries can reach. Once per Go module.
      - run: |
          for module in apps/kuben apps/kuben-agent packages/api; do
            (cd "$module" && ../../scripts/go-tool.sh govulncheck ./...)
          done

  image:
    name: Published image (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: trivy@0.74.0
      # The image is distroless plus the static binaries. Go embeds the module
      # list in every binary, so the Go modules inside are scanned too.
      - name: Scan ghcr.io/teamtem-dev/kuben:latest
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/teamtem-dev/kuben:latest

  # A failed scheduled run only emails whoever last edited the cron line.
  # One open issue makes it visible to everyone; later failures comment on it.
  report:
    name: Report failure
    needs: [advisories, image]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled security check failed"
          body="The daily security workflow failed: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
