name: Security

# Advisories are published after code is merged: a lockfile that passed CI
# yesterday can be vulnerable today. This re-checks main and the published
# image every day, independent of any change.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  advisories:
    name: RustSec advisories (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # A failed scheduled run only emails whoever last edited the cron line.
  # One open issue makes it visible to everyone; later failures comment on it.
  report:
    name: Report failure
    needs: [advisories]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled security check failed"
          body="The daily security workflow failed: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
