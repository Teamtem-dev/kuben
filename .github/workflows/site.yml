name: Site

# kuben.teamtem.com: apps/site (Astro + Starlight) on Cloudflare Pages.
# Pull requests only build (the Web job in ci.yml also builds it); pushes to
# main deploy. The REST API reference is rendered from the committed OpenAPI
# spec, so a change to it redeploys the site too.
#
# Deploying needs the repository variable CLOUDFLARE_ACCOUNT_ID and the secret
# CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). Until the variable is set the
# deploy job is skipped, so main stays green before Cloudflare is configured.

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/api-client/openapi.json
      - .github/workflows/site.yml
  pull_request:
    paths:
      - apps/site/**
      - packages/api-client/openapi.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site is JS-only, so Bun and the workspace dependencies are enough;
      # the package scripts are called directly, without turbo (no Rust needed).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/site check
      - run: bun run --cwd apps/site build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: apps/site/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://kuben.teamtem.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      # The Pages project `kuben` must exist and have kuben.teamtem.com as a
      # custom domain.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kuben --branch=main --commit-dirty=true
