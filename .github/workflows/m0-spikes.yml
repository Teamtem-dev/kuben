name: M0 spikes

# Disposable-cluster spikes for ADR-028, ADR-029 and ADR-031. They install
# third-party components into a throwaway kind cluster, so they run on
# demand and on M0 branches only, and never gate the main CI.
on:
  workflow_dispatch:
  push:
    branches: ["feat/m0-*"]
    paths:
      - "scripts/spikes/**"
      - ".github/workflows/m0-spikes.yml"

permissions:
  contents: read

concurrency:
  group: m0-spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-build-tls:
    name: Registry, rootless build and Gateway TLS (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kuben-spikes
          wait: 120s
      - name: Install htpasswd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils
      - name: Run the spikes
        run: scripts/spikes/m0-registry-build-tls.sh
        env:
          KIND_NODE: kuben-spikes-control-plane
