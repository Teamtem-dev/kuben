name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) that matches the version in
# Cargo.toml. Produces static binaries for 5 targets, checksums, build
# provenance, a GitHub Release and a multi-arch image on GHCR.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  IMAGE: ghcr.io/teamtem-dev/kuben

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: meta
        name: Validate tag against Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1
          fi
          version="${TAG#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kuben") | .version')
          if [[ "$version" != "$crate" ]]; then
            echo "::error::tag $TAG does not match the kuben crate version $crate"; exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          { echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; } >>"$GITHUB_OUTPUT"

  web:
    name: Web UI
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [plan, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, zig: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-15, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, smoke: true }
    env:
      TARGET: ${{ matrix.target }}
      USE_ZIG: ${{ matrix.zig || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache in release jobs: releases are built from scratch so a
      # poisoned cache can never reach a published artifact.
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.zig
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-zigbuild
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist
      - name: Build
        run: |
          build=build
          if [[ "$USE_ZIG" == "true" ]]; then build=zigbuild; fi
          cargo "$build" -p kuben --release --locked --features embed-ui --target "$TARGET"
      - name: Size budget
        if: contains(matrix.target, 'linux')
        run: scripts/check-budgets.sh binary "target/$TARGET/release/kuben"
      - name: Smoke test
        if: matrix.smoke
        run: target/$TARGET/release/kuben --version
      - name: Package
        run: |
          name="kuben-${TARGET}"
          stage=$(mktemp -d)
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/kuben.exe" LICENSE README.md "$stage/"
            (cd "$stage" && 7z a -tzip -bso0 "${GITHUB_WORKSPACE}/dist/${name}.zip" kuben.exe LICENSE README.md)
          else
            cp "target/${TARGET}/release/kuben" LICENSE README.md "$stage/"
            tar -C "$stage" -czf "dist/${name}.tar.gz" kuben LICENSE README.md
          fi
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh .
          for f in *.tar.gz *.zip; do sha256sum -- "$f" >"$f.sha256"; done
          sha256sum -- *.tar.gz *.zip install.sh >checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create or update the release
        env:
