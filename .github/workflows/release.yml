name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) that matches the version in
# Cargo.toml. Produces static binaries for 5 targets, checksums, build
# provenance, a GitHub Release and a multi-arch image on GHCR.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  IMAGE: ghcr.io/teamtem-dev/kuben

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: meta
        name: Validate tag against Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1
          fi
          version="${TAG#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kuben") | .version')
          if [[ "$version" != "$crate" ]]; then
            echo "::error::tag $TAG does not match the kuben crate version $crate"; exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          { echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; } >>"$GITHUB_OUTPUT"

  web:
    name: Web UI
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The package scripts directly, not turbo: a release never restores
      # anything from a cache, and the SPA needs no Rust toolchain.
      - name: Build and check the size budget
        working-directory: apps/web
        run: bun run build && bun run size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [plan, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, zig: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-15, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, smoke: true }
    env:
      TARGET: ${{ matrix.target }}
      USE_ZIG: ${{ matrix.zig || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache in release jobs: releases are built from scratch so a
      # poisoned cache can never reach a published artifact.
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.zig
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-zigbuild
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist
      - name: Build
        run: |
          build=build
          if [[ "$USE_ZIG" == "true" ]]; then build=zigbuild; fi
          cargo "$build" -p kuben --release --locked --features embed-ui --target "$TARGET"
      - name: Size budget
        if: contains(matrix.target, 'linux')
        run: scripts/check-budgets.sh binary "target/$TARGET/release/kuben"
      - name: Smoke test
        if: matrix.smoke
        run: target/$TARGET/release/kuben --version
      - name: Package
        run: |
          name="kuben-${TARGET}"
          stage=$(mktemp -d)
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/kuben.exe" LICENSE README.md "$stage/"
            (cd "$stage" && 7z a -tzip -bso0 "${GITHUB_WORKSPACE}/dist/${name}.zip" kuben.exe LICENSE README.md)
          else
            cp "target/${TARGET}/release/kuben" LICENSE README.md "$stage/"
            tar -C "$stage" -czf "dist/${name}.tar.gz" kuben LICENSE README.md
          fi
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh .
          for f in *.tar.gz *.zip; do sha256sum -- "$f" >"$f.sha256"; done
          sha256sum -- *.tar.gz *.zip install.sh >checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" dist/*

  image:
    name: Container image (linux/amd64, linux/arm64)
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Stage binaries per platform
        run: |
          mkdir -p image/linux-amd64 image/linux-arm64
          tar -xzf dist/kuben-x86_64-unknown-linux-musl.tar.gz -C image/linux-amd64 kuben
          tar -xzf dist/kuben-aarch64-unknown-linux-musl.tar.gz -C image/linux-arm64 kuben
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` and `X.Y` only for stable releases; pre-releases get their exact tag.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }}
          flavor: latest=auto
      - name: Image size budget (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/release.Dockerfile
          platforms: linux/amd64
          load: true
          tags: kuben:budget
      - run: scripts/check-budgets.sh image kuben:budget
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart (OCI)
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push to oci://ghcr.io/teamtem-dev/charts
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint --strict charts/kuben
          helm package charts/kuben --version "$VERSION" --app-version "$VERSION" --destination dist
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/kuben-${VERSION}.tgz" oci://ghcr.io/teamtem-dev/charts

  verify-install:
    name: install.sh on ${{ matrix.os }}
    needs: [plan, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install the published release and run it
        env:
          KUBEN_VERSION: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash install.sh --dir "$RUNNER_TEMP/bin" --no-sudo
          "$RUNNER_TEMP/bin/kuben" --version | tee /dev/stderr | grep -F "$VERSION"
