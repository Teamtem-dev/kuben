name: Setup
description: >-
  Bun (version from package.json `packageManager`) and the JS dependencies.
  Jobs that build or test Go install it first with actions/setup-go, pinned
  to the version in go.work.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile
