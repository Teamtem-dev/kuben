version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and the local composite action they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    # The Go modules of go.work and the pinned tools (tools/go.mod).
    directories: ["/apps/kuben", "/apps/kuben-agent", "/packages/api", "/tools"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-minor:
        update-types: [minor, patch]
