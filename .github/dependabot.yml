version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and the local composite action they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    # The modules of the Go workspace (go.work).
    directories: ["/go/hub", "/go/agent", "/go/kubenapi", "/go/tools"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-minor:
        update-types: [minor, patch]
