[package]
name = "kuben-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kuben persistence: PostgreSQL through sqlx, with embedded migrations"

[features]
# Test support: an isolated PostgreSQL schema per test (`testing::pg_store`).
testing = []

[dependencies]
kuben-core.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
# The integration tests use `testing::pg_store`, which only exists with the feature.
kuben-store = { workspace = true, features = ["testing"] }

[lints]
workspace = true
