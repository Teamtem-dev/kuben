[package]
name = "kuben"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kuben — single-binary Kubernetes-native PaaS"
default-run = "kuben"

[[bin]]
name = "kuben"
path = "src/main.rs"

[features]
default = []
# Scale-to-zero proxy. Only a placeholder until phase 2, so release builds
# leave it out rather than advertise a role that does nothing.
embed-ui = ["kuben-api/embed-ui"]
activator = ["kuben-platform/activator"]
full = ["embed-ui", "activator"]

[dependencies]
kuben-core.workspace = true
kuben-crd.workspace = true
kuben-store.workspace = true
kuben-platform.workspace = true
kuben-api.workspace = true
tokio.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
figment.workspace = true
serde.workspace = true
tokio-util.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
rand.workspace = true
base64.workspace = true
axum.workspace = true

[lints]
workspace = true
