packages:
  - apps/*
  - packages/*

# Single source of truth for JS dependency versions: package.json files only
# ever say `catalog:`. Add a dependency here first, then reference it.
catalogMode: strict
catalog:
  "@biomejs/biome": 2.5.13
  "@size-limit/file": ^12.1.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
