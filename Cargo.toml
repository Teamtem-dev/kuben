[workspace]
resolver = "3"
members = [
  "crates/kuben",
  "crates/kuben-api",
  "crates/kuben-core",
  "crates/kuben-crd",
  "crates/kuben-platform",
  "crates/kuben-store",
]
default-members = ["crates/kuben"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Teamtem-dev/kuben"
homepage = "https://github.com/Teamtem-dev/kuben"
authors = ["Kuben Contributors"]

[workspace.dependencies]
# ---- internal ----
kuben-core = { path = "crates/kuben-core", version = "0.1.0" }
kuben-crd = { path = "crates/kuben-crd", version = "0.1.0" }
kuben-store = { path = "crates/kuben-store", version = "0.1.0" }
kuben-platform = { path = "crates/kuben-platform", version = "0.1.0" }
kuben-api = { path = "crates/kuben-api", version = "0.1.0" }

