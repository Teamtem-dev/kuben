[workspace]
resolver = "3"
members = [
  "crates/kuben",
  "crates/kuben-api",
  "crates/kuben-core",
  "crates/kuben-crd",
  "crates/kuben-platform",
  "crates/kuben-store",
]
default-members = ["crates/kuben"]

# Turborepo's package name for the Cargo workspace as a whole: `kuben-cargo#<task>`
# in turbo.json runs a workspace-wide Cargo command (see docs/adr/0024).
[workspace.metadata]
name = "kuben-cargo"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Teamtem-dev/kuben"
homepage = "https://github.com/Teamtem-dev/kuben"
authors = ["Kuben Contributors"]

[workspace.dependencies]
# ---- internal ----
kuben-core = { path = "crates/kuben-core", version = "1.0.1" }
kuben-crd = { path = "crates/kuben-crd", version = "1.0.1" }
kuben-store = { path = "crates/kuben-store", version = "1.0.1" }
kuben-platform = { path = "crates/kuben-platform", version = "1.0.1" }
kuben-api = { path = "crates/kuben-api", version = "1.0.1" }

# ---- runtime / http ----
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "macros", "json", "query", "tokio", "http1", "http2"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "compression-br", "compression-gzip", "request-id", "set-header", "cors", "sensitive-headers", "normalize-path", "util"] }
http = "1"
bytes = "1"

# ---- kubernetes ----
kube = { version = "4", default-features = false, features = ["client", "runtime", "derive", "ws", "rustls-tls", "gzip", "cel", "http-proxy"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = "1"

# ---- data ----
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "uuid", "derive", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
time = "0.3"

# ---- concurrency / cache ----
dashmap = "6"
arc-swap = "1"
parking_lot = "0.12"
moka = { version = "0.12", features = ["future"] }

# ---- auth / crypto ----
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"
sha2 = "0.10"
rand = "0.9"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
base64 = "0.22"

# ---- api docs / validation ----
utoipa = { version = "5", features = ["axum_extras", "uuid", "preserve_order"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# ---- config / cli / errors / observability ----
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
backon = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
mimalloc = "0.1"

# ---- test ----
insta = { version = "1", features = ["yaml", "json"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
