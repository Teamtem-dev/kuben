[workspace]
resolver = "3"
members = [
  "crates/kuben",
  "crates/kuben-api",
  "crates/kuben-core",
  "crates/kuben-crd",
  "crates/kuben-platform",
  "crates/kuben-store",
]
default-members = ["crates/kuben"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Teamtem-dev/kuben"
homepage = "https://github.com/Teamtem-dev/kuben"
authors = ["Kuben Contributors"]
