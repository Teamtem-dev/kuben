{{- /*
Scheduled backups (M4.7): `kuben backup` runs next to PostgreSQL's client
tools (the chart's PostgreSQL image) and writes to a kept volume. Copy the
backups off the cluster: a backup on the same storage is no backup.
*/}}
{{- if .Values.backup.enabled }}
{{- $name := printf "%s-backup" (include "kuben.fullname" .) }}
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.deadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "kuben.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The release image has no shell: the binary copies itself.
            - name: kuben
              image: {{ include "kuben.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["copy-self", "/tools/kuben"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: {{ .Values.backup.image | default (include "kuben.postgresql.image" .) }}
              imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
              command:
                - /tools/kuben
                - backup
                - --scheduled
                {{- if .Values.backup.includeKeyring }}
                - --include-keyring
                {{- end }}
              env:
                {{- include "kuben.databaseEnv" . | trim | nindent 16 }}
                - name: KUBEN_SECRETS__KEYRING_FILE
                  value: /etc/kuben/keyring/secrets.keyring
                - name: KUBEN_BACKUP__DIR
                  value: /backups
                - name: KUBEN_BACKUP__KEEP
                  value: {{ .Values.backup.keep | quote }}
                - name: KUBEN_SERVER__STATE_DIR
                  value: /tmp/kuben
                - name: HOME
                  value: /tmp
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: keyring
                  mountPath: /etc/kuben/keyring
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tools
              emptyDir:
                sizeLimit: 128Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.existingClaim | default $name }}
            - name: keyring
              secret:
                secretName: {{ include "kuben.keyring.secret" . }}
                defaultMode: 0400
{{- end }}
