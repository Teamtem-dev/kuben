{{- /*
The keyring of managed secrets (M4.4, ADR-030): every replica and the backup
job read the same keys. Made once and kept on `helm uninstall`: without it,
the secrets in the database cannot be read. Back it up apart from the
database.
*/}}
{{- if not .Values.secrets.existingKeyringSecret }}
{{- $name := include "kuben.keyring.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "secrets.keyring") }}
  secrets.keyring: {{ index $existing.data "secrets.keyring" }}
  {{- else }}
  secrets.keyring: {{ printf "# Kuben secret keyring: version:base64 key. Back it up apart from the database.\n1:%s\n" (randBytes 32) | b64enc }}
  {{- end }}
{{- end }}
