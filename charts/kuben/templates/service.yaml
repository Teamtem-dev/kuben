apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kuben.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      appProtocol: http
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
