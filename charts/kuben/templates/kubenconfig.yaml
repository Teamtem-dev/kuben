{{- if .Values.platform.create }}
{{- with .Values.platform.gateway }}
{{- if not (regexMatch "^[a-z0-9-]+/[a-z0-9-]+$" .) }}
{{- fail "platform.gateway must be `namespace/name`" }}
{{- end }}
{{- end }}
apiVersion: kuben.dev/v1alpha1
kind: KubenConfig
metadata:
  name: kuben
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
  annotations:
    # Kept by `helm uninstall`: deleted while the pod is still stopping, the
    # controller would reconcile every App against empty platform settings
    # and remove their public routes. A re-install adopts it again.
    helm.sh/resource-policy: keep
{{- /* Built as a map: with no platform settings an empty `spec:` would be
  null, which the CRD rejects, so the default install must render `{}`. */}}
{{- $spec := dict }}
{{- with .Values.platform.baseDomain }}{{ $_ := set $spec "baseDomain" . }}{{ end }}
{{- with .Values.platform.gateway }}{{ $_ := set $spec "gateway" . }}{{ end }}
{{- with .Values.platform.clusterIssuer }}{{ $_ := set $spec "clusterIssuer" . }}{{ end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
