{{- $bundled := include "kuben.postgresql.bundled" . }}
{{- $legacy := printf "%s-data" (include "kuben.fullname" .) }}
{{- if and (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $legacy) (not .Values.legacy.sqliteVolumeAcknowledged) }}
{{- fail (printf "the volume %s holds the SQLite database of a Kuben 1.x install. Kuben keeps its data in PostgreSQL and does not carry 1.x data over: set legacy.sqliteVolumeAcknowledged=true to start with a new, empty database (the volume stays untouched)" $legacy) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Roll pods one at a time with no downtime. The controllers follow the
    # `kuben-controller` Lease, so two pods never reconcile at once.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kuben.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuben.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kuben.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      {{- if $bundled }}
      initContainers:
        # The server exits while its database is unreachable: wait for the
        # chart's PostgreSQL instead of restarting against it.
        - name: wait-for-postgresql
          image: {{ include "kuben.postgresql.image" . }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -q -h {{ include "kuben.postgresql.fullname" . }} -p 5432; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- end }}
      containers:
        - name: kuben
          image: {{ include "kuben.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--roles=all"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- if .Values.agent.enabled }}
            - name: agentlink
              containerPort: {{ .Values.agent.port }}
            {{- end }}
          env:
            - name: KUBEN_KUBE__REQUIRED
              value: "true"
            # Home of the controller Lease and the initial admin Secret.
            - name: KUBEN_KUBE__NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Only the Lease holder reconciles: safe with several replicas and
            # during rolling updates.
            - name: KUBEN_KUBE__LEADER_ELECTION
              value: "true"
            - name: KUBEN_TELEMETRY__LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: KUBEN_SERVER__METRICS_BIND
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            - name: KUBEN_SECURITY__COOKIE_SECURE
              value: {{ .Values.security.cookieSecure | quote }}
            # Behind the Gateway: the last X-Forwarded-For hop is the real client.
            - name: KUBEN_SECURITY__TRUST_FORWARDED_FOR
              value: "true"
            - name: KUBEN_BOOTSTRAP__ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            {{- with .Values.admin.existingSecret }}
            - name: KUBEN_BOOTSTRAP__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            {{- include "kuben.databaseEnv" . | trim | nindent 12 }}
            # The managed-secret keyring, shared by every replica (M4.4).
            - name: KUBEN_SECRETS__KEYRING_FILE
              value: /etc/kuben/keyring/secrets.keyring
            - name: KUBEN_BACKUP__MAX_AGE_HOURS
              value: {{ ternary .Values.backup.maxAgeHours 0 .Values.backup.enabled | quote }}
            {{- if .Values.agent.enabled }}
            # M2.8: the hub of the agent in this cluster, which it enrolls
            # from a Secret the hub keeps up to date.
            - name: KUBEN_AGENT__BIND
              value: "0.0.0.0:{{ .Values.agent.port }}"
            - name: KUBEN_AGENT__LOCAL
              value: "true"
            - name: KUBEN_AGENT__ADVERTISE
              value: "{{ include "kuben.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.agent.port }}"
            - name: KUBEN_AGENT__NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- with .Values.publicUrl }}
            - name: KUBEN_SERVER__PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: keyring
              mountPath: /etc/kuben/keyring
              readOnly: true
      volumes:
        - name: keyring
          secret:
            secretName: {{ include "kuben.keyring.secret" . }}
            defaultMode: 0400
        # The state directory (setup token): the data is in PostgreSQL.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
