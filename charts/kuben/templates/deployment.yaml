{{- $postgres := or .Values.database.url .Values.database.existingSecret }}
{{- if and (gt (int .Values.replicaCount) 1) (not $postgres) }}
{{- fail "replicaCount > 1 requires PostgreSQL (database.url or database.existingSecret): SQLite supports one replica" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $postgres }}
    # PostgreSQL: roll pods one at a time with no downtime. The controllers
    # follow the `kuben-controller` Lease, so two pods never reconcile at once.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # The SQLite volume is ReadWriteOnce: never run two pods against it.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "kuben.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuben.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kuben.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: kuben
          image: {{ include "kuben.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--roles=all"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: KUBEN_KUBE__REQUIRED
              value: "true"
            # Home of the controller Lease and the initial admin Secret.
            - name: KUBEN_KUBE__NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Only the Lease holder reconciles: safe with several replicas and
            # during rolling updates.
            - name: KUBEN_KUBE__LEADER_ELECTION
              value: "true"
            - name: KUBEN_TELEMETRY__LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: KUBEN_SERVER__METRICS_BIND
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            - name: KUBEN_SECURITY__COOKIE_SECURE
              value: {{ .Values.security.cookieSecure | quote }}
            # Behind the Gateway: the last X-Forwarded-For hop is the real client.
            - name: KUBEN_SECURITY__TRUST_FORWARDED_FOR
              value: "true"
            - name: KUBEN_BOOTSTRAP__ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            {{- with .Values.admin.existingSecret }}
            - name: KUBEN_BOOTSTRAP__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: KUBEN_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: url
            {{- else if .Values.database.url }}
            - name: KUBEN_DATABASE__URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- with .Values.publicUrl }}
            - name: KUBEN_SERVER__PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
