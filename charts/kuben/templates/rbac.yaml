apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
---
# Exactly what the controllers and the API touch. Kuben creates one namespace
# per environment, so namespace-scoped rights must be cluster-wide; every
# object it writes is labelled `app.kubernetes.io/managed-by=kuben`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [kuben.dev]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces, services, secrets, resourcequotas, limitranges, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Kuben owns the listeners of its (dedicated) Gateway for automatic HTTPS.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kuben.fullname" . }}
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kuben.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuben.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election (ADR-023): the `kuben-controller` Lease lives in Kuben's
# own namespace, so this right is namespaced rather than cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kuben.fullname" . }}-leader-election
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuben.fullname" . }}-leader-election
  labels:
    {{- include "kuben.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuben.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kuben.fullname" . }}
    namespace: {{ .Release.Namespace }}
