---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubenconfigs.kuben.dev
spec:
  group: kuben.dev
  names:
    kind: KubenConfig
    plural: kubenconfigs
    shortNames:
    - kcfg
    singular: kubenconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseDomain
      name: BaseDomain
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KubenConfigSpec via `CustomResource`
        properties:
          spec:
            properties:
              baseDomain:
                description: Base domain for generated app hostnames, e.g. `apps.example.com`.
                nullable: true
                type: string
              clusterIssuer:
                description: cert-manager ClusterIssuer name.
                nullable: true
                type: string
              gateway:
                description: Gateway API `Gateway` used for HTTPRoutes (`namespace/name`).
                nullable: true
                type: string
              registry:
                description: Container registry used for build outputs.
                nullable: true
                properties:
                  credentialsSecret:
                    description: Secret (in `kuben-system`) holding a `.dockerconfigjson`.
                    nullable: true
                    type: string
                  prefix:
                    description: e.g. `ghcr.io/acme`.
                    type: string
                required:
                - prefix
                type: object
              sizes:
                default:
                - cpuLimit: null
                  cpuRequest: 50m
                  memoryLimit: 128Mi
                  memoryRequest: 64Mi
                  name: nano
                - cpuLimit: null
                  cpuRequest: 100m
                  memoryLimit: 256Mi
                  memoryRequest: 128Mi
                  name: small
                - cpuLimit: null
                  cpuRequest: 250m
                  memoryLimit: 1Gi
                  memoryRequest: 512Mi
                  name: medium
                - cpuLimit: null
                  cpuRequest: '1'
                  memoryLimit: 4Gi
                  memoryRequest: 2Gi
                  name: large
                description: Compute size presets.
                items:
                  description: Compute size preset (resolved from `KubenConfig.spec.sizes`).
                  properties:
                    cpuLimit:
                      nullable: true
                      type: string
                    cpuRequest:
                      type: string
                    memoryLimit:
                      type: string
                    memoryRequest:
                      type: string
                    name:
                      type: string
                  required:
                  - cpuRequest
                  - memoryLimit
                  - memoryRequest
                  - name
                  type: object
                type: array
              wildcardTlsSecret:
                description: |-
                  Secret in the Gateway's namespace holding a certificate for
                  `*.<baseDomain>` (DNS-01). When set, generated hostnames share one
                  wildcard HTTPS listener instead of one listener per host.
                nullable: true
                type: string
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: |-
                    kstatus-style condition. Mirrors `metav1.Condition` without pulling the
                    `schemars` feature of `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      nullable: true
                      type: string
                    status:
                      description: '`"True"`, `"False"` or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: KubenConfig
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
