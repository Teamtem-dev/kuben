                    `schemars` feature of `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      nullable: true
                      type: string
                    status:
                      description: '`"True"`, `"False"` or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
