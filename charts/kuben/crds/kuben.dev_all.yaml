apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.kuben.dev
spec:
  group: kuben.dev
  names:
    kind: App
    plural: apps
    shortNames:
    - kapp
    singular: app
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.currentRelease
      name: Release
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AppSpec via `CustomResource`
        properties:
          spec:
            properties:
              domains:
                items:
                  properties:
                    host:
                      type: string
                    tls:
                      default: auto
                      description: '`auto` (cert-manager), `none`, or a Secret name.'
                      type: string
                  required:
                  - host
                  type: object
                type: array
              env:
                items:
                  description: Environment variable. Exactly one of `value`, `fromSecret`, `fromService`.
                  properties:
                    fromSecret:
                      description: Reference to a key inside a Secret/ConfigMap/Service in the same namespace.
                      nullable: true
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    fromService:
                      description: Reference to a key inside a Secret/ConfigMap/Service in the same namespace.
                      nullable: true
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      type: string
                    value:
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                type: array
              runtime:
                properties:
                  fsGroup:
                    description: |-
                      Group id that owns the volumes (`fsGroup`), for images running as a
                      non-root user, e.g. `1000`.
                    format: int64
                    nullable: true
                    type: integer
                  healthCheck:
                    nullable: true
                    properties:
                      path:
                        type: string
                      port:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        nullable: true
                        type: integer
                    required:
                    - path
                    type: object
                  processes:
                    additionalProperties:
                      properties:
                        command:
                          items:
                            type: string
                          type: array
                        idle:
                          description: Scale-to-zero / throttling configuration (Master Blueprint §3.3).
                          nullable: true
                          properties:
                            after:
                              default: 15m
                              description: Inactivity before sleeping, e.g. `15m`.
                              type: string
                            mode:
                              default: off
                              enum:
                              - off
                              - zero
                              - throttle
                              type: string
                          type: object
                        port:
                          format: uint16
                          maximum: 65535.0
                          minimum: 0.0
                          nullable: true
                          type: integer
                        protocol:
                          description: How a process's port is exposed.
                          enum:
                          - http
                          - tcp
                          type: string
                        replicas:
                          default:
                            max: 1
                            min: 1
                          properties:
                            max:
                              default: 1
                              format: uint32
                              minimum: 0.0
                              type: integer
                            min:
                              default: 1
                              format: uint32
                              minimum: 0.0
                              type: integer
                          type: object
                        schedule:
                          description: |-
                            Cron expression (scenario 7). A scheduled process runs as a CronJob
                            instead of a Deployment and may not expose a port.
                          nullable: true
                          type: string
                        size:
                          default: small
                          description: Size preset name from `KubenConfig.spec.sizes`.
                          type: string
                        timeZone:
                          description: IANA time zone for `schedule`, e.g. `Europe/Berlin` (default UTC).
                          nullable: true
                          type: string
                      type: object
                    description: Named processes (`web`, `worker`, ...). Exactly one may expose a port.
                    type: object
                required:
                - processes
                type: object
              source:
                description: |-
                  Where the image comes from. Set exactly one of `image` or `git`
                  (Kubernetes one-of style: structural CRD schemas cannot express tagged enums).
                properties:
                  git:
                    description: Build from a git repository.
                    nullable: true
                    properties:
                      branch:
                        default: main
                        type: string
                      build:
                        default:
                          strategy: auto
                        properties:
                          dockerfile:
                            description: Dockerfile path relative to `path` (strategy `dockerfile`).
                            nullable: true
                            type: string
                          strategy:
                            default: auto
                            enum:
                            - dockerfile
                            - railpack
                            - auto
                            type: string
                        type: object
                      path:
                        type: string
                      repo:
                        type: string
                    required:
                    - repo
                    type: object
                  image:
                    description: Prebuilt image, e.g. `ghcr.io/acme/api:1.2.3`. Pinned to a digest at `Release` time.
                    nullable: true
                    type: string
                type: object
              volumes:
                description: |-
                  Persistent volumes (scenario 6). An app with volumes runs a single
                  process with at most one replica (ReadWriteOnce).
                items:
                  description: |-
                    A persistent volume mounted into the app's process. Backed by a PVC named
                    `<app>-<name>` that is **retained** when the app is deleted.
                  properties:
                    mountPath:
                      description: Absolute path inside the container, e.g. `/data`.
                      type: string
                    name:
                      type: string
                    size:
                      default: 1Gi
                      description: Requested capacity, e.g. `5Gi`. Can grow, never shrink.
                      type: string
                    storageClass:
                      description: StorageClass; the cluster default when omitted.
                      nullable: true
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
            required:
            - runtime
            - source
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: |-
                    kstatus-style condition. Mirrors `metav1.Condition` without pulling the
                    `schemars` feature of `k8s-openapi`.
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      nullable: true
                      type: string
                    status:
                      description: '`"True"`, `"False"` or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              currentRelease:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              url:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: App
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
