image:
  repository: ghcr.io/teamtem-dev/kuben
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# SQLite supports exactly one replica. With PostgreSQL (`database.url`) every
# replica serves the API, only the holder of the `kuben-controller` Lease runs
# the controllers, and upgrades roll without downtime.
replicaCount: 1

admin:
  email: admin@kuben.local
  # Secret with a `password` key. Empty: a random password is generated on the
  # first start and stored in the Secret `kuben-initial-admin` (never logged).
  existingSecret: ""

database:
  # Empty: SQLite on the persistent volume (`sqlite:///data/kuben.db`).
  url: ""
  # Secret with a `url` key (PostgreSQL credentials); wins over `url`.
  existingSecret: ""

# Volume for the SQLite database (not created with PostgreSQL).
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

# Public URL of the UI, e.g. https://kuben.example.com
publicUrl: ""

security:
  # Keep true in production: the session cookie is then `__Host-` + `Secure`.
  cookieSecure: true

# Cluster-wide platform settings (the `KubenConfig` singleton).
platform:
  create: true
  # Apps get `<app>-<environment>.<baseDomain>` hostnames.
  baseDomain: ""
  # Gateway API Gateway for app routes, as `namespace/name`.
  gateway: ""
  # cert-manager ClusterIssuer; enables https URLs.
  clusterIssuer: ""
