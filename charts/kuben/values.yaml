image:
  repository: ghcr.io/teamtem-dev/kuben
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Every replica serves the API; only the holder of the `kuben-controller`
# Lease runs the controllers, and upgrades roll without downtime. More than one
# replica wants an external PostgreSQL (`database`): the chart's own is a
# single instance.
replicaCount: 1

admin:
  email: admin@kuben.local
  # Secret with a `password` key. Empty: a random password is generated on the
  # first start and stored in the Secret `kuben-initial-admin` (never logged).
  existingSecret: ""

# Kuben keeps its data in PostgreSQL (ADR-025).
database:
  # An external PostgreSQL, e.g. postgres://kuben:…@db.example.com/kuben.
  # Both empty: the chart's own PostgreSQL (`postgresql` below).
  url: ""
  # Secret with a `url` key (the credentials stay in the Secret); wins over `url`.
  existingSecret: ""

# The chart's own PostgreSQL, used when `database` is empty: one instance on a
# volume, no replication, for a single server or a pilot. Kuben connects as
# the ordinary role `kuben` (row-level security applies). `helm uninstall`
# keeps its volume and its password Secret.
postgresql:
  image:
    repository: docker.io/library/postgres
    tag: "17-alpine"
    # Pinned by the release's bundle lock (bundle.lock.json); empty pulls the tag.
    digest: "sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73"
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Managed secrets (M4.4): their values are sealed with the keys of a keyring
# that never enters the database.
secrets:
  # Secret with a `secrets.keyring` key (`version:base64-key` lines). Empty:
  # the chart makes one and keeps it on `helm uninstall`. Back it up apart
  # from the database: a restore needs it.
  existingKeyringSecret: ""

# Scheduled backups of the database (M4.7): `kuben backup` in a CronJob, to a
# kept volume. Copy them off the cluster (a backup on the same storage is no
# backup) and check a restore now and then (`kuben restore --check`).
backup:
  enabled: true
  schedule: "17 3 * * *"
  # Backups kept on the volume.
  keep: 7
  # Kuben reports itself degraded when the newest good backup is older.
  maxAgeHours: 26
  # Also copy the keyring into each backup: whoever has such a backup can
  # read every secret.
  includeKeyring: false
  # Before `helm upgrade`: a backup, then the new version's preflight; a
  # failure stops the upgrade (see `kuben upgrade-check`).
  beforeUpgrade: true
  # The preflight refuses a major version step (1.2 → 2.0) unless told the
  # operator read its release notes: set true for that one upgrade
  # (`kuben upgrade-check --major`), then back to false.
  upgradeCheckMajor: false
  # An image with PostgreSQL client tools at least as new as the server;
  # default: the chart's PostgreSQL image.
  image: ""
  deadlineSeconds: 3600
  persistence:
    size: 20Gi
    storageClass: ""
    # Write to this claim instead of making one.
    existingClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

# A 1.x install kept its data in SQLite on the volume `<fullname>-data`. This
# chart keeps the data in PostgreSQL and does not carry 1.x data over. An
# upgrade over such a volume stops, so that a fresh, empty database is never
# taken for lost data; set this to start with the new database anyway (the
# volume stays untouched).
legacy:
  sqliteVolumeAcknowledged: false

# Public URL of the UI, e.g. https://kuben.example.com
publicUrl: ""

security:
  # Keep true in production: the session cookie is then `__Host-` + `Secure`.
  # `auto` follows publicUrl (https → Secure); false only for development.
  cookieSecure: true

# Cluster-wide platform settings (the `KubenConfig` singleton).
platform:
  create: true
  # Apps get `<app>-<environment>.<baseDomain>` hostnames.
  baseDomain: ""
  # GatewayClass of the Gateway Kuben creates and owns for app routes (e.g.
  # `traefik` on k3s, `envoy-gateway`). Kuben writes only that Gateway's
  # listeners; it never touches a Gateway that is not dedicated to it.
  gatewayClassName: ""
  # Gateway API Gateway for app routes, as `namespace/name`. With
  # gatewayClassName it defaults to `kuben-system/kuben` and Kuben creates it;
  # without, it must exist and carry the label kuben.dev/gateway-owner=kuben.
  gateway: ""
  # Listener ports of that Gateway. Traefik (also k3s's) matches listeners to
  # its entry points: set {http: 8000, https: 8443} there.
  gatewayPorts: {}
  # cert-manager ClusterIssuer; enables https URLs.
  clusterIssuer: ""

# The cluster agent (ADR-027, M2.8): a separate, unprivileged process that
# carries apps out in this cluster. It enrolls on its own from a Secret Kuben
# keeps (no token to copy) and keeps its identity in a Secret of its own.
# Apps made while it is linked are delivered by it; the others stay with the
# App controller. Best with replicaCount 1 until HA lands (M7).
agent:
  enabled: true
  port: 7443

# Single sign-on with an OpenID Connect provider (M4.3, `[sso]`). Local
# accounts keep working; the callback URL to register at the provider is
# `<publicUrl>/api/v1/auth/sso/callback` (publicUrl is required).
sso:
  enabled: false
  # The provider's issuer URL; its discovery document names the rest.
  issuer: ""
  clientId: ""
  # Secret with the client secret (key `clientSecretKey`), mounted as a file:
  # the secret never appears in the pod spec.
  existingSecret: ""
  clientSecretKey: client-secret
  # Shown on the sign-in button.
  displayName: Single sign-on
  scopes: [openid, email, profile]
  # The ID token claim that lists the person's groups.
  groupClaim: groups
  # Provider group → organization role (viewer, developer, admin, owner),
  # re-read at every sign-in, e.g. {platform-admins: owner, developers: developer}.
  groups: {}
  # Role of people in no mapped group; empty refuses them.
  defaultRole: ""
  # Email domains allowed to sign in; empty allows any.
  allowedDomains: []
  requireVerifiedEmail: true
  # Organization people join; empty: the bootstrap organization.
  org: ""
  # Accounts linked to the provider cannot also sign in with a password.
  disablePasswordForLinked: false

# External CI trust (M4.2, `[ci]`): GitHub Actions exchanges its OIDC token
# for a short-lived Kuben token under a trust policy an owner creates in
# Settings. The exchange endpoint is `<publicUrl>/api/v1/ci/github/token`.
ci:
  githubActions:
    enabled: false
    # The audience workflows request (`id-token` audience); empty: publicUrl.
    audience: ""

# Git sources through a GitHub App (M3, `[git]`). All three of appId, the
# private key and the webhook secret are needed; GitHub delivers webhooks to
# `<publicUrl>/api/v1/webhooks/github`.
#
# Token connections to GitHub, GitLab and Gitea/Forgejo (2.1) are not chart
# values: an organization admin adds them at runtime (Settings → Integrations,
# or `POST /api/v1/git/connections`), and their tokens are sealed with the
# keyring. Their push webhooks go to
#   <publicUrl>/api/v1/webhooks/gitlab/<connection id>   (X-Gitlab-Token)
#   <publicUrl>/api/v1/webhooks/gitea/<connection id>    (X-Gitea-Signature)
# so publicUrl must be reachable from the Git host. Organization registry
# logins (Settings → Registries) are runtime data too.
git:
  github:
    # The GitHub App's numeric id; empty turns Git sources off.
    appId: ""
    # Secret holding the App's private key (PEM, key `privateKeyKey`) and the
    # webhook secret (key `webhookSecretKey`).
    existingSecret: ""
    privateKeyKey: private-key.pem
    webhookSecretKey: webhook-secret
    # For GitHub Enterprise Server: the REST API root and where builds clone from.
    apiUrl: https://api.github.com
    cloneUrl: https://github.com

# Isolated builds of Git sources (ADR-028, `[build]`): one rootless BuildKit
# Job per attempt, then an SBOM and a vulnerability scan. Sources come from
# the GitHub App (`git.github`) or from Git connections an organization adds
# at runtime (GitHub, GitLab, Gitea/Forgejo tokens); either is enough.
# Empty values keep the server's defaults (see the configuration reference);
# pin every image by digest in production.
build:
  enabled: false
  # Namespace of the build Jobs; empty: the release namespace.
  namespace: ""
  buildkitImage: ""
  fetchImage: ""
  scannerImage: ""
  # Both set: Railpack builds for sources without a Dockerfile.
  railpackFrontend: ""
  railpackImage: ""
  # Builds at once over all organizations, and per organization.
  maxConcurrent: 2
  maxConcurrentPerOrg: 1
  # A kubernetes.io/dockerconfigjson Secret in the build namespace with push
  # access to the image repositories; empty for an open registry.
  pushSecret: ""
  # Push over plain HTTP (an in-cluster registry without TLS).
  insecureRegistry: false
  # Node selector `key=value` of a dedicated build pool.
  nodePool: ""
  # Per build (empty: 500m request, 2 CPU limit, 2Gi memory, 10Gi disk, 30 min).
  cpuRequest: ""
  cpuLimit: ""
  memory: ""
  ephemeralStorage: ""
  deadlineSeconds: 0
  # How much of the end of each build's log is kept when the build ends, so
  # the log outlives the build pod: 1 to 1024 KiB; 0 keeps the server's 256.
  logTailKiB: 0

# Git connections and organization registries (2.1, `[integrations]`).
# Organization admins choose the address of a self-hosted GitLab or Gitea and
# the server of a registry, and Kuben calls them; by default it refuses any
# that resolves to a private, loopback or link-local address. Set this when
# your Git server or registry runs inside your network: every organization
# admin can then reach private addresses through Kuben.
integrations:
  allowPrivateHosts: false

# Expose the Kuben UI itself through a Gateway API HTTPRoute.
route:
  enabled: false
  hostname: ""
  gateway:
    name: ""
    namespace: ""

service:
  type: ClusterIP
  port: 80

metrics:
  port: 9090

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
