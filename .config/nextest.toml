# cargo-nextest: every test runs in its own process (no shared global state
# between tests, e.g. environment variables), tests run in parallel across
# crates, and every failure is reported instead of stopping at the first.
# Doctests are not run by nextest; CI runs them with `cargo test --doc`.

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 0
