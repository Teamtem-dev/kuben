# Bun settings for the whole workspace: https://bun.com/docs/runtime/bunfig

[install]
# pnpm-style layout: a package can only import what it declares.
linker = "isolated"
# No `minimumReleaseAge`: on Bun 1.4.0 any re-resolution under it fails with a
# misleading "<pkg>@catalog: is not in the catalog" error. Dependabot's 7-day
# cooldown stays the supply-chain gate for updates (ADR-024).

# bun.lock stays registry-neutral: entries record no registry URL, only the
# integrity hash, so CI installs from registry.npmjs.org and a developer's
# mirror still works. Mirrors can lack platform binaries (a missing optional
# dependency is skipped silently), so resolve new packages against npmjs:
#   BUN_CONFIG_REGISTRY=https://registry.npmjs.org/ bun add <pkg>
