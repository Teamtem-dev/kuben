[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "serde_yaml", reason = "unmaintained; use serde_yaml_ng" },
]

[advisories]
yanked = "deny"
ignore = [
  # `paste` is archived and unmaintained, with no safe upgrade. It reaches us
  # only through utoipa-axum, as a compile-time macro helper: it contributes no
  # runtime code and takes no untrusted input. Revisit when utoipa-axum drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro dep of utoipa-axum; no fixed version exists" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
